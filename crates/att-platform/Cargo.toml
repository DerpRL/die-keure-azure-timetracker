[package]
name = "att-platform"
description = "OS integration behind traits: credentials, calendar, microphone, presence, app windows, paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
att-core.workspace = true
jiff.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
dirs.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }

# Windows implementation (src/windows). Only the `windows` crate: no C build scripts, and imports
# resolve through raw-dylib, so the crate cross-checks from macOS without the Windows SDK.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
