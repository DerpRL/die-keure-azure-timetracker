[package]
name = "att-engine"
description = "Orchestration for Azure timetracker: state, scheduling, intents and change events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Derive `ts_rs::TS` on the UI contract types (used by the contract export test).
ts = ["dep:ts-rs", "att-core/ts", "att-platform/ts"]

[dependencies]
att-core.workspace = true
att-store.workspace = true
att-net.workspace = true
att-platform.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true
uuid.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
