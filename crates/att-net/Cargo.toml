[package]
name = "att-net"
description = "7pace Timetracker, 7pace OAuth/PIN and Azure DevOps clients for Azure timetracker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
att-core.workspace = true
async-trait.workspace = true
base64.workspace = true
jiff.workspace = true
# The workspace enables rustls (aws-lc-rs + the OS certificate verifier), json and form. URLSession
# also honoured the OS proxy settings, negotiated HTTP/2 and accepted gzip, so those are enabled too.
reqwest = { workspace = true, features = ["system-proxy", "http2", "gzip"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
wiremock.workspace = true
