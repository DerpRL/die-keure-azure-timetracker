name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            # The failures as one annotation, readable in the run summary and through the API.
            summary=$(awk '/^failures:$/{on=1} on{print} /^test result:/{on=0}' test.log | head -150)
            [ -n "$summary" ] || summary=$(tail -40 test.log)
            summary=${summary//'%'/'%25'}; summary=${summary//$'\r'/'%0D'}; summary=${summary//$'\n'/'%0A'}
            echo "::error title=cargo test failed::$summary"
            exit 1
          }
      # The TypeScript contract (apps/desktop/src/ipc/generated.ts) matches the Rust types.
      - run: cargo test -p att-engine --features ts --test contract_ts

  ui:
    name: UI
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  legacy-swift:
    name: Legacy Swift (bridge release)
    # Package.swift needs Swift tools 6.0: macos-15 defaults to Xcode 16 (macos-14 to Xcode 15).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift.log || {
            summary=$(grep -E 'error:|failed|Fatal|crashed' swift.log | head -80)
            [ -n "$summary" ] || summary=$(tail -40 swift.log)
            summary=${summary//'%'/'%25'}; summary=${summary//$'\r'/'%0D'}; summary=${summary//$'\n'/'%0A'}
            echo "::error title=swift test failed::$summary"
            exit 1
          }
