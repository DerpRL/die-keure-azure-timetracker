name: CI

on:
  push:
    branches: [main, "rewrite/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15: the release tool's tests build the legacy Swift signer (Swift tools 6.0).
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            # Each failing test with its panic, and compile errors with a few lines of context.
            awk '{ gsub(/\033\[[0-9;]*m/, "") }
              /^---- .* stdout ----$/ { name = $2; next }
              /panicked at/ { print name ": " substr($0, index($0, "panicked at")); left = 3; next }
              / targets? failed:$/ { print; left = 50; next }
              /^error(\[E[0-9]+\])?: / { print; left = 4; next }
              /^[[:space:]]*$/ { left = 0; next }
              left > 0 && !/^note: run with/ { print "  " $0; left-- }' test.log > summary.txt || true
            bash .github/scripts/annotate.sh "cargo test failed" summary.txt
            exit 1
          }
      # The TypeScript contract (apps/desktop/src/ipc/generated.ts) matches the Rust types.
      - run: cargo test -p att-engine --features ts --test contract_ts

  ui:
    name: UI
    runs-on: macos-14
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  legacy-swift:
    name: Legacy Swift (bridge release)
    # The 1.x sources are built with a current Swift (6.4 on the release Mac); Xcode 16's Swift 6.1
    # rejects some of them, so this runs on macos-26 (Xcode 26).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swift --version
      - name: swift test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift.log || {
            # Compiler errors repeat per architecture and in the summary: each one once.
            { grep -E 'error:|✘|recorded an issue|Fatal|crashed' swift.log | awk '!seen[$0]++' | head -80; tail -15 swift.log; } > summary.txt || true
            bash .github/scripts/annotate.sh "swift test failed" summary.txt
            exit 1
          }
