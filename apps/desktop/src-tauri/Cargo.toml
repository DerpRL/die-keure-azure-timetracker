[package]
name = "att-desktop"
description = "Azure timetracker desktop shell: tray icon, windows, quick-switch shortcut and Tauri plugin wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "att_desktop_lib"

[features]
# Serves `frontendDist` (../dist) through the tauri:// protocol instead of loading `devUrl`.
# `tauri build` turns this on by itself; `cargo build --features custom-protocol` runs a debug
# binary against an already built frontend without the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
att-core.workspace = true
att-engine.workspace = true
att-platform.workspace = true
att-store.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

# Same major versions as Tauri's own AppKit, WebKit and Win32 bindings, so the types match the
# handles Tauri hands out (`ns_window`, `hwnd`, the tray's `NSStatusItem`, the WKWebView).
# The image, data and WebKit features serve the debug-build snapshot switch only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibilityProtocols",
    "NSBitmapImageRep",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKSnapshotConfiguration",
    "WKWebView",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
