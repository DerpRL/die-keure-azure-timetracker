[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri app joins the workspace once the shell and engine are merged.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
att-core = { path = "crates/att-core" }
att-net = { path = "crates/att-net" }
att-platform = { path = "crates/att-platform" }
att-store = { path = "crates/att-store" }
att-engine = { path = "crates/att-engine" }

jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
fancy-regex = "0.19"
unicode-normalization = "0.1"
sha2 = "0.11"
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
tracing = "0.1"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"

# Test-only
wiremock = "0.6"
tempfile = "3"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
